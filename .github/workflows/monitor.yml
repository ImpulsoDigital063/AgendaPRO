name: monitor

# Blindagem: chama /api/cron/monitor 4x/dia (nao precisa mais que isso · evita
# inflar invocacoes Vercel + minutos do Actions · Eduardo 09/06).
# (Vercel Hobby so permite cron 1x/dia, por isso o agendador vive aqui.)
# Horarios UTC = BRT-3:
#   11 UTC = 08 BRT → health-check + auditoria financeira (so segunda · gate no route)
#   16/20/23 UTC = 13/17/20 BRT → operacao parada (so alerta apos 12h BRT) + health
on:
  schedule:
    - cron: '0 11,16,20,23 * * *' # 4x/dia (UTC; o GitHub pode atrasar alguns min)
  workflow_dispatch: {} # permite rodar na mao pelo botao "Run workflow"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: chamar o monitor
        run: |
          code=$(curl -s -o /tmp/out -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.agendapro.net.br/api/cron/monitor")
          echo "HTTP $code"
          cat /tmp/out
          echo
          # falha o job (= GitHub te avisa por email) se o monitor nao responder 200
          test "$code" = "200"
